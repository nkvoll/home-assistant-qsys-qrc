call_method:
  name: Call QRC Method
  description: |
    Invokes a method on a Q-SYS device using QRC. See the
    QRC Commands Documentation (https://q-syshelp.qsc.com/Index.htm#External_Control_APIs/QRC/QRC_Commands.htm)
    for more details
  fields:
    device_id:
      name: Q-SYS Device
      description: The Q-SYS device to call the method on
      required: true
      selector:
        device:
          integration: qsys_qrc
    method:
      name: Method
      description: Name of the method to invoke
      required: true
      example: Component.Set
      selector:
        text:
    params:
      name: Parameters
      description: Parameters to the method
      required: true
      example: |
        Name: my apm
        Controls:
        - Name: ent.xfade.gain
          Value: -100.0
          Ramp: 2.0
      default: { }
      selector:
        object:
reload:
export_configuration:
  name: Export entity configuration
  description: Return a portable configuration object. The Configure dialog also provides a portable YAML export. Requires administrator access.
  fields:
    core_name:
      name: Core name
      description: The configured Core name whose entity definitions should be exported.
      required: true
      selector:
        text:
    effective:
      name: Include effective YAML mappings
      description: Export active YAML and UI mappings instead of only UI-owned mappings.
      default: false
      selector:
        boolean:

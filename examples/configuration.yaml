# Loads default set of integrations. Do not remove.
default_config:

# Text to speech
tts:
  - platform: google_translate

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

logger:
  default: info
  #logs:
  #  homeassistant.components.cloud: warn

qsys_qrc:
  cores:
    # the name of the core must match the integration one
    my_core:
      platforms:
        media_player:
        - component: media_stream_receiver_1
          min_db: -60
          max_db: 0
        - component: audio_player_doorbell_main
          min_db: -60
          max_db: 0

        switch:
        - component: bathroom_f2_gain
          control: mute
          device_class: switch

        number:
        - component: bathroom_f2_gain
          control: gain
          # Map gain Value in dB to a useful 0–100% slider.
          volume_mode: db
          min_db: -60
          max_db: 0
          step: 0.1
        - component: studio_gain
          control: gain
          # Preserve raw dB Value mode with UI limits matching your Q-SYS block.
          min: -80
          max: 12
          unit_of_measurement: dB
          # Generic Position scaling remains available in legacy mode:
          # use_position: true
          # position_lower_limit: 0.30
          # position_upper_limit: 0.83333331
        #- component: bathroom_f1_gain
        #  control: gain
        #  min: 0
        #  max: 100
        #  step: 0.1
        #  mode: slider
        #  change_template: "{{ round(100 * (math.pow(10, value/50)-0.01)/0.99, 1) }}"
        #  value_template: "{{ 50 * math.log(value/100*0.99+0.01, 10) }}"%

        select:
          - name: "Apple Lights"
            control: "Apple.Lights" # options auto-populated from Choices

        text:
          - name: "Hue Lights"
            control: "Hue.Lights"

        sensor:
          - name: "Roon Now Playing"
            control: "Text_ControllerNowPlaying_Text"
            attribute: "String"